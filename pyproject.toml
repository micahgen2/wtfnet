[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wtfnet"
version = "0.1.0"
description = "A snarky network diagnostic battery that tells you which layer is fucked."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = ["rich>=13.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
wtfnet = "wtfnet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
